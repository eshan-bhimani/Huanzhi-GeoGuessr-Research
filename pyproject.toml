[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["apps/", "tests/"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests that require Playwright + API key",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["apps/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]