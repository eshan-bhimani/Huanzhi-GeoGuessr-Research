<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Street View Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="pano-container"></div>
    <div id="side-panel">
      <div class="panel-header">
        <div>
          <h1>AI Street View Navigator</h1>
          <p class="panel-subtitle">Control the scene, capture a clean initial state.</p>
        </div>
        <div class="panel-actions">
          <button id="send-step-btn" class="btn btn-primary" type="button">Send Step</button>
        </div>
      </div>

      <section class="card">
        <h3>Start Location</h3>
        <div class="field-grid">
          <div class="field">
            <label for="lat-input">Lat</label>
            <input id="lat-input" type="number" step="0.000001" placeholder="37.7749">
          </div>
          <div class="field">
            <label for="lng-input">Lng</label>
            <input id="lng-input" type="number" step="0.000001" placeholder="-122.4194">
          </div>
          <div class="field">
            <label for="heading-input">Heading</label>
            <input id="heading-input" type="number" step="1" placeholder="120">
          </div>
        </div>
        <button id="go-location-btn" class="btn btn-secondary" type="button">Go</button>
      </section>


      <section class="card">
        <h3>Observation JSON</h3>
        <textarea id="ai-output" readonly></textarea>
      </section>

      <section class="card">
        <h3>Backend Response</h3>
        <pre id="action-text"></pre>
        <pre id="pano-json"></pre>
        <img id="pano-img" alt="Street View snapshot" />
      </section>
    </div>
  </div>
  
  <!-- Local overrides -->
  <script src="config.local.js"></script>
  <!-- URL param parsing + runtime config -->
  <script src="config.js"></script>
  <!-- Load Google Maps JS API with runtime key, then bootstrap app.js -->
  <script>
    (function(){
      const key = window.GOOGLE_MAPS_KEY;
      if(!key) {
        console.error("Missing GOOGLE_MAPS_KEY. Set maps-ui/config.local.js or add ?gmapsKey=...");
        return;
      }
      const script = document.createElement('script');
      script.src =
        "https://maps.googleapis.com/maps/api/js?key=" +
        encodeURIComponent(key) +
        "&libraries=geometry";
      script.async = true;
      script.defer = true;
      script.onload = () => {
        const appScript = document.createElement('script');
        appScript.type = "module";
        appScript.src = "app.js";
        document.body.appendChild(appScript);
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
