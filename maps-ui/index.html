<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Street View Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="pano-container"></div>
    <div id="side-panel">
      <div class="panel-header">
        <div>
          <h1>AI Street View Navigator</h1>
          <p class="panel-subtitle">Control the scene, capture a clean initial state.</p>
        </div>
        <div class="panel-actions">
          <button id="btn-random" class="btn btn-ghost" type="button">Teleport Random</button>
          <button id="send-step-btn" class="btn btn-primary" type="button">Send Step</button>
        </div>
      </div>

      <section class="card">
        <h3>Start Location</h3>
        <div class="field-grid">
          <div class="field">
            <label for="lat-input">Lat</label>
            <input id="lat-input" type="number" step="0.000001" placeholder="37.7749">
          </div>
          <div class="field">
            <label for="lng-input">Lng</label>
            <input id="lng-input" type="number" step="0.000001" placeholder="-122.4194">
          </div>
          <div class="field">
            <label for="radius-input">Radius (m)</label>
            <input id="radius-input" type="number" step="1" placeholder="500">
          </div>
          <div class="field">
            <label for="heading-input">Heading</label>
            <input id="heading-input" type="number" step="1" placeholder="120">
          </div>
        </div>
        <button id="go-location-btn" class="btn btn-secondary" type="button">Go</button>
      </section>


      <section class="card">
        <h3>Observation JSON</h3>
        <textarea id="ai-output" readonly></textarea>
      </section>

      <section class="card">
        <h3>Backend Response</h3>
        <pre id="action-text"></pre>
        <pre id="pano-json"></pre>
        <img id="pano-img" alt="Street View snapshot" />
      </section>
    </div>
  </div>
  
  <!-- Google Maps JS API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=api_key&libraries=geometry"></script>
  <!-- Expose the key for static image fetches -->
  <script>
    window.GOOGLE_MAPS_KEY = 'api_key';
    window.APP_CONFIG = {
      panoContainerId: "pano-container",
      randomButtonId: "btn-random",
      startLocation: {  lat: 38.88918843, lng: -77.02835864  },
      radius: 500,
      initialHeading: 120,
      apiBase: "http://localhost:8000",
      pollIntervalMs: 1000,
    };
  </script>
  <!-- Your environment script -->
  <script type="module" src="app.js"></script>
 
</body>
</html>
