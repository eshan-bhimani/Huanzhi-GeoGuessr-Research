services:
  geoguessr-worker:
    build:
      context: .
    stdin_open: true
    tty: true
    environment:
      GOOGLE_MAPS_API_KEY: "api-key"
      IMAGE_OUTPUT_DIR: /data/images
    volumes:
      - geoguessr-images:/data/images
    shm_size: "1gb"
    restart: "no"

volumes:
  geoguessr-images: