<!-- Run a localhost using your google api key -->

<!DOCTYPE html>
<html>
  <head>
    <title>Full Screen Street View</title>
    <style>
      /* 1. Make the map fill the entire window */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      
      /* 2. The container for the Street View */
      #pano {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="pano"></div>
    <!-- INSERT API KEY HERE -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=APIKEYHERE&callback=initStreetView&v=weekly"
      defer
    ></script>

    <script>
      function initStreetView() {
        // 3. Define the starting coordinates (Smithsonian Station, Washington DC)
        const startLocation = { lat: 38.88918843189586, lng: -77.02835863881397 };

        // 4. Initialize the Street View Panorama
        const panorama = new google.maps.StreetViewPanorama(
          document.getElementById("pano"),
          {
            position: startLocation,
            pov: {
              heading: 34,  // Direction camera is facing (0 is North)
              pitch: 10     // Angle up or down
            },
            zoom: 1,       // Zoom level
            
            // UI Controls Customization
            addressControl: true,     // Shows the address box
            fullscreenControl: true,  // Shows the toggle fullscreen button
            linksControl: true,       // Shows the navigation arrows on the road
            panControl: true,         // Shows the compass/pan control
            enableCloseButton: false, // Hides the 'X' button (since there is no map to close to)
            showRoadLabels: false,     // Shows street names on the ground
            clickToGo: true,          // Allows for clicking navigation
          }
        );
      }
    </script>
  </body>
</html>
