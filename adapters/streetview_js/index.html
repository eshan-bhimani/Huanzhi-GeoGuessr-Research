<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Street View Host</title>
    <style>
      html, body, #pano {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="pano"></div>
    <script>
      // Inject Maps JS API script with API key from the query param.
      (() => {
        const params = new URLSearchParams(location.search);
        const key = params.get("key") || "";
        const script = document.createElement("script");
        script.src =
          "https://maps.googleapis.com/maps/api/js?key=" +
          encodeURIComponent(key) +
          "&v=weekly";
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      })();
    </script>
    <script src="./bridge.js"></script>
  </body>
</html>
